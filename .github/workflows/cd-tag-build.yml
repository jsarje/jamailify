name: CD - Build Docker on Tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Docker image for tag on main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is on origin/main
        run: |
          TAG_REF=${GITHUB_REF#refs/tags/}
          echo "Tag: $TAG_REF"
          git fetch origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag commit is on origin/main — continuing"
          else
            echo "Tag commit is NOT on origin/main — skipping build"
            exit 0
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker image tags
        id: compute_tags
        run: |
          TAG_REF=${GITHUB_REF#refs/tags/}
          IFS='.' read -r P1 P2 _ <<< "$TAG_REF"
          MAJOR="$P1"
          if [ -n "$P2" ]; then
            MAJOR_MINOR="$P1.$P2"
          else
            MAJOR_MINOR="$P1"
          fi
          echo "full=$TAG_REF" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "major_minor=$MAJOR_MINOR" >> $GITHUB_OUTPUT
          echo "latest=latest" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.compute_tags.outputs.full }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.compute_tags.outputs.major }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.compute_tags.outputs.major_minor }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:          
          body: "Container image: [ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.ref_name }}](https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }})"
          generate_release_notes: true