name: CD - Build Docker on Tag

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build:
    name: Build Docker image for tag on main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0

      - name: Verify tag is on origin/main
        run: |
          TAG_REF=${GITHUB_REF#refs/tags/}
          echo "Tag: $TAG_REF"
          git fetch origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag commit is on origin/main — continuing"
          else
            echo "Tag commit is NOT on origin/main — skipping build"
            exit 0
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.repository }}:${{ github.ref_name }}
