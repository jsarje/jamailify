name: CD - Build Docker on Tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build Docker image for tag on main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is on origin/main
        run: |
          TAG_REF=${GITHUB_REF#refs/tags/}
          echo "Tag: $TAG_REF"
          git fetch origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag commit is on origin/main — continuing"
          else
            echo "Tag commit is NOT on origin/main — skipping build"
            exit 0
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.ref_name }}


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:          
          body: "Container image: [ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.ref_name }}](https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }})"
          generate_release_notes: true